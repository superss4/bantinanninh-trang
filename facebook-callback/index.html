<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer"><title>Đang kết nối Facebook…</title><link rel="stylesheet" href="../style.css"></head><body>
<h1>Đang chuyển về trang quản trị…</h1>
<p>Trang này chỉ chuyển mã cấp quyền Facebook về công cụ quản trị chạy trên máy tính của quản trị viên (localhost). Nếu không tự chuyển, hãy kiểm tra máy chủ "Bản tin An ninh" đã chạy chưa.</p>
<script>
  // Chỉ chuyển tiếp code/state về máy chủ nội bộ trên chính máy này; trang không lưu hay gửi dữ liệu đi nơi khác.
  // Facebook có thể trả kết quả sau dấu # (fragment) – chuyển thành tham số truy vấn để máy chủ nội bộ đọc được.
  var q = location.search || (location.hash.length > 1 ? '?' + location.hash.slice(1) : '');
  location.replace('http://localhost:3210/admin/facebook/callback' + q);
</script>
</body></html>
